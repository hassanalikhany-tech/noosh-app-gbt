
<!DOCTYPE html>
<html lang="fa" dir="rtl" class="noosh-starting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#276556">
    <meta name="description" content="نوش؛ برنامه‌ریزی غذا، دستور پخت و لیست خرید برای آشپزخانهٔ شما." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/noosh-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/noosh-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NOOSH APP | برنامه‌ریزی و دستور پخت</title>
    <link rel="preload" as="image" href="/brand/noosh-logo.png" fetchpriority="high" />
    <style>
      html.noosh-starting,html.noosh-starting body{overflow:hidden!important}
      #noosh-startup{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;min-height:100svh;box-sizing:border-box;padding:40px 24px calc(110px + env(safe-area-inset-bottom));background:#276556;color:#e8b95b;text-align:center;font-family:Vazirmatn,Tahoma,sans-serif;opacity:1;transition:opacity .3s ease}
      #noosh-startup.noosh-startup-leaving{opacity:0;pointer-events:none}
      .noosh-startup-center{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.5vh,22px)}
      .noosh-startup-wordmark{display:flex;align-items:baseline;gap:9px;margin:0;direction:ltr;font-family:Georgia,'Times New Roman',serif;font-size:clamp(27px,7.2vw,38px);font-weight:800;letter-spacing:.12em;line-height:1;color:#f3deac;text-shadow:0 3px 16px #123e3040}
      .noosh-startup-wordmark span{font-size:.68em;font-weight:700;letter-spacing:.2em;color:#e8b95b}
      .noosh-startup-logo{display:block;width:clamp(150px,30vw,210px);height:auto;aspect-ratio:1;object-fit:contain;animation:noosh-startup-float 4.8s ease-in-out infinite;filter:drop-shadow(0 14px 22px #123e3024)}
      .noosh-startup-motto{margin:0;font-size:clamp(18px,4.6vw,27px);font-weight:600;line-height:1.9;color:#f3deac}
      #noosh-startup-status{min-height:34px;max-width:340px;margin:0;font-size:17px;font-weight:700;line-height:1.9;color:#e8b95b}
      .noosh-startup-loading{display:inline-flex;align-items:baseline;gap:7px}
      .noosh-loading-dots{display:inline-flex;width:10ch;direction:rtl;justify-content:flex-start;white-space:nowrap;font-family:monospace;font-size:19px;font-weight:700}
      .noosh-loading-dot{display:inline-block;width:1ch;text-align:center;opacity:0}
      .noosh-loading-dot:nth-child(1){animation:noosh-dot-1 6s linear infinite}
      .noosh-loading-dot:nth-child(2){animation:noosh-dot-2 6s linear infinite}
      .noosh-loading-dot:nth-child(3){animation:noosh-dot-3 6s linear infinite}
      .noosh-loading-dot:nth-child(4){animation:noosh-dot-4 6s linear infinite}
      .noosh-loading-dot:nth-child(5){animation:noosh-dot-5 6s linear infinite}
      .noosh-loading-dot:nth-child(6){animation:noosh-dot-6 6s linear infinite}
      .noosh-loading-dot:nth-child(7){animation:noosh-dot-7 6s linear infinite}
      .noosh-loading-dot:nth-child(8){animation:noosh-dot-8 6s linear infinite}
      .noosh-loading-dot:nth-child(9){animation:noosh-dot-9 6s linear infinite}
      .noosh-loading-dot:nth-child(10){animation:noosh-dot-10 6s linear infinite}
      @keyframes noosh-dot-1{0%{opacity:0}5%,50%{opacity:1}55%,100%{opacity:0}}
      @keyframes noosh-dot-2{0%,5%{opacity:0}10%,55%{opacity:1}60%,100%{opacity:0}}
      @keyframes noosh-dot-3{0%,10%{opacity:0}15%,60%{opacity:1}65%,100%{opacity:0}}
      @keyframes noosh-dot-4{0%,15%{opacity:0}20%,65%{opacity:1}70%,100%{opacity:0}}
      @keyframes noosh-dot-5{0%,20%{opacity:0}25%,70%{opacity:1}75%,100%{opacity:0}}
      @keyframes noosh-dot-6{0%,25%{opacity:0}30%,75%{opacity:1}80%,100%{opacity:0}}
      @keyframes noosh-dot-7{0%,30%{opacity:0}35%,80%{opacity:1}85%,100%{opacity:0}}
      @keyframes noosh-dot-8{0%,35%{opacity:0}40%,85%{opacity:1}90%,100%{opacity:0}}
      @keyframes noosh-dot-9{0%,40%{opacity:0}45%,90%{opacity:1}95%,100%{opacity:0}}
      @keyframes noosh-dot-10{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
      .noosh-startup-credit{position:absolute;inset-inline:20px;bottom:calc(24px + env(safe-area-inset-bottom));margin:0;color:#e8b95b;font-size:clamp(11px,2.9vw,14px);font-weight:500;line-height:2;text-wrap:balance}
      .noosh-startup-credit strong{font-weight:700;letter-spacing:.07em}
      #noosh-startup-retry{border:1px solid #e8b95b70;border-radius:12px;background:transparent;color:#f3deac;padding:10px 18px;font:inherit;font-size:13px;cursor:pointer}
      #noosh-startup-retry[hidden]{display:none}
      @keyframes noosh-startup-float{0%,100%{transform:translateY(6px)}50%{transform:translateY(-10px)}}
      @media(max-height:460px){#noosh-startup{padding-bottom:65px}.noosh-startup-center{gap:10px}.noosh-startup-wordmark{font-size:25px}.noosh-startup-logo{width:100px}.noosh-startup-motto{font-size:18px}.noosh-startup-credit{bottom:12px}}
      @media(prefers-reduced-motion:reduce){.noosh-startup-logo{animation:none}#noosh-startup{transition:none}.noosh-loading-dot{animation:none!important;opacity:1}}
      @media print{#noosh-startup{display:none!important}}
    </style>
    <script>document.documentElement.dataset.nooshStartedAt=String(performance.now());</script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" media="print" onload="this.media='all'" />
    <style>
      :root { color-scheme: light; }
      html { min-height: 100%; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
      body {
        font-family: 'Vazirmatn', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        margin: 0; padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      
      .animate-filter-in {
        animation: filterIn 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      .animate-filter-out {
        animation: filterOut 1s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
      }

      @keyframes filterIn {
        0% { transform: translate(-50%, -150%) scale(0.7); opacity: 0; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }
      @keyframes filterOut {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        100% { transform: translate(-50%, -150%) scale(0.7); opacity: 0; }
      }

      .animate-enter { animation: enter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(10px); }
      @keyframes enter { to { opacity: 1; transform: translateY(0); } }
      
      @keyframes slideDown {
        0% { transform: translateY(-100%) scale(0.9); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      .animate-slide-down {
        animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }

      .metallic-navy { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #020617 100%); }
      
      .bg-noosh-pattern {
        background-image: url('https://i.ibb.co/gMDKtj4p/3.png');
        background-repeat: repeat; background-size: 80px;
        opacity: 0.02; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      }

      @media (max-width: 640px) {
        button, a { min-height: 44px; min-width: 44px; }
        input, select, textarea { font-size: 16px !important; }
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* انیمیشن لرزش ملایم برای تمام دکمه‌ها در حالت هوور */
      @keyframes buttonShake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-1px) rotate(-0.5deg); }
        75% { transform: translateX(1px) rotate(0.5deg); }
      }
      button:hover:not(:disabled) {
        animation: buttonShake 0.3s ease-in-out infinite;
      }

      /* انیمیشن زیبا برای لوگو */
      @keyframes logoPop {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }
      .logo-animate:hover {
        animation: logoPop 0.6s ease-in-out forwards;
      }
      .logo-animate:active {
        transform: scale(0.95);
        transition: transform 0.1s;
      }

      /* استایل‌های کاملاً اصلاح شده برای چاپ حرفه‌ای چند صفحه‌ای */
      @media print {
        @page { 
          size: A4 portrait; 
          margin: 0; 
        }
        
        html, body, #root, [class*="h-[100dvh]"], main { 
          height: auto !important; 
          overflow: visible !important; 
          min-height: 0 !important;
          position: static !important;
        }

        .no-print { display: none !important; }
        .print-only { display: block !important; }
        
        .print-page-container {
          width: 210mm;
          height: 297mm; /* ارتفاع ثابت A4 برای تراز شدن فوتر در پایین */
          padding: 15mm 15mm 10mm 15mm;
          margin: 0 auto;
          background: white !important;
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
          page-break-after: always;
          break-after: page;
          position: relative;
        }

        .print-table { 
          width: 100%; 
          border-collapse: collapse; 
          margin-top: 10mm; 
          margin-bottom: auto; /* اجازه می‌دهد فوتر به پایین رانده شود */
        }
        
        .print-table th, .print-table td { 
          border: 1px solid #e2e8f0; 
          padding: 8px 10px; 
          text-align: right; 
          font-size: 12px;
          line-height: 1.4;
        }
        
        .print-table th { 
          background-color: #f1f5f9 !important; 
          -webkit-print-color-adjust: exact; 
          font-weight: 900; 
          color: #0f172a; 
        }
        
        .print-header { 
          border-bottom: 3px solid #0d9488; 
          padding-bottom: 5mm; 
          flex-shrink: 0; 
        }
        
        .print-footer { 
          width: 100%; 
          text-align: center; 
          font-size: 10px; 
          color: #94a3b8; 
          border-top: 1px solid #f1f5f9; 
          padding-top: 5mm;
          margin-top: auto; 
          flex-shrink: 0;
        }
      }
      .print-only { display: none; }
    </style>


</head>
  <body>
    <div id="noosh-startup" role="region" aria-label="به نوش‌اپ خوش آمدید">
      <div class="noosh-startup-center">
        <p class="noosh-startup-wordmark" dir="ltr"><strong>NOOSH</strong><span>APP</span></p>
        <img class="noosh-startup-logo" src="/brand/noosh-logo.png" alt="لوگوی نوش‌اپ" width="210" height="210" fetchpriority="high" />
        <p class="noosh-startup-motto">همراه سلامتی و آسایش شما</p>
        <p id="noosh-startup-status" role="status" aria-live="polite"><span class="noosh-startup-loading">در حال بارگذاری<span class="noosh-loading-dots" aria-hidden="true"><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span><span class="noosh-loading-dot" dir="ltr">.</span></span></span></p>
        <button id="noosh-startup-retry" type="button" hidden>تلاش دوباره</button>
        <noscript><p style="color:#f3deac">برای بازکردن نوش‌اپ، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
      </div>
      <p class="noosh-startup-credit">طراحی و توسعه توسط شرکت فنی‌مهندسی <strong dir="ltr">CYDEVIT</strong></p>
    </div>
    <div class="bg-noosh-pattern no-print"></div>
    <div id="root" inert aria-hidden="true"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
